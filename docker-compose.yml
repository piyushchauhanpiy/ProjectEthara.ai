version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      APP_CORS_ALLOWED_ORIGINS: 'http://localhost:5173,http://localhost:80,http://localhost'
    networks:
      - stock-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/stocks
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - stock-net

networks:
  stock-net:
    driver: bridge
